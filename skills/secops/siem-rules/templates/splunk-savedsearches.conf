##############
# Splunk Saved Search - SIEM Detection Rule
# Deploy this snippet to: $SPLUNK_HOME/etc/apps/<your-app>/local/savedsearches.conf
##############

[SIEM - Password Spray Detection]
disabled = 0
enableSched = 1
alert.digest_mode = 1
alert.settings = {
  "action.summary_index": {
    "enabled": 1
  },
  "action.notable": {
    "enabled": 1
  }
}
alert.supressed = 1
alert.track = 1
alert_comparator = greater than
alert_threshold = 0
alert_type = number of events
counttype = number of events
cron_schedule = */5 * * * *
description = Detects multiple distinct accounts with failed authentication from the same source IP. ATT&CK: T1110.003
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
display.general.type = statistics
display.page.search.tab = statistics
display.visualizations.charting.legend.placement = right
display.visualizations.charting.chart = column
is_scheduled = 1
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=wineventlog sourcetype="WinEventLog:Security" EventCode=4625 \
  | bin _time span=10m \
  | stats dc(TargetUserName) as distinct_accounts, count as attempt_count, values(TargetUserName) as target_accounts, earliest(_time) as first_attempt, latest(_time) as last_attempt by IpAddress, _time \
  | where distinct_accounts >= 10 \
  | eval attack_duration_sec = last_attempt - first_attempt \
  | eval first_attempt = strftime(first_attempt, "%Y-%m-%d %H:%M:%S") \
  | eval last_attempt = strftime(last_attempt, "%Y-%m-%d %H:%M:%S") \
  | sort - distinct_accounts \
  | table _time, IpAddress, distinct_accounts, attempt_count, attack_duration_sec, target_accounts
action.notable.param.rule_description = Password Spray Attack Detected: $distinct_accounts$ distinct accounts targeted from $IpAddress$
action.notable.param.rule_title = SIEM - Password Spray Detection
action.notable.param.security_domain = access
action.summary_index._name = summary
action.summary_index.inverse = 0

[SIEM - Impossible Travel Detection]
disabled = 0
enableSched = 1
alert.digest_mode = 1
alert.settings = {
  "action.summary_index": {
    "enabled": 1
  },
  "action.notable": {
    "enabled": 1
  }
}
alert.supressed = 1
alert.track = 1
alert_comparator = greater than
alert_threshold = 0
alert_type = number of events
counttype = number of events
cron_schedule = */15 * * * *
description = Detects logins from geographically distant locations within implausible time. ATT&CK: T1078
dispatch.earliest_time = -24h@h
dispatch.latest_time = @h
display.general.type = statistics
is_scheduled = 1
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=o365 sourcetype="o365:management:activity" Operation=UserLoggedIn \
  | iplocation ClientIP \
  | where isnotnull(lat) AND isnotnull(lon) \
  | sort 0 UserId _time \
  | streamstats current=f window=1 last(lat) as prev_lat, last(lon) as prev_lon, last(_time) as prev_time, last(City) as prev_city, last(Country) as prev_country, last(ClientIP) as prev_ip by UserId \
  | where isnotnull(prev_lat) \
  | eval time_diff_hours = (_time - prev_time) / 3600 \
  | eval distance_km = 2 * 6371 * asin(sqrt(pow(sin((lat - prev_lat) * pi() / 360), 2) + cos(prev_lat * pi() / 180) * cos(lat * pi() / 180) * pow(sin((lon - prev_lon) * pi() / 360), 2))) \
  | where distance_km >= 500 \
  | eval required_speed_kmh = if(time_diff_hours > 0, distance_km / time_diff_hours, 99999) \
  | where required_speed_kmh > 900 \
  | eval current_location = City . ", " . Country \
  | eval previous_location = prev_city . ", " . prev_country \
  | table _time, UserId, current_location, previous_location, time_diff_hours, distance_km, required_speed_kmh, ClientIP, prev_ip
action.notable.param.rule_description = Impossible Travel: $UserId$ traveled $distance_km$ km in $time_diff_hours$ hours
action.notable.param.rule_title = SIEM - Impossible Travel Detection
action.notable.param.security_domain = access
action.summary_index._name = summary
action.summary_index.inverse = 0

[SIEM - Privileged Account Off-Hours Logon]
disabled = 0
enableSched = 1
alert.digest_mode = 1
alert.settings = {
  "action.summary_index": {
    "enabled": 1
  },
  "action.notable": {
    "enabled": 1
  }
}
alert.supressed = 1
alert.track = 1
alert_comparator = greater than
alert_threshold = 0
alert_type = number of events
counttype = number of events
cron_schedule = */15 * * * *
description = Detects privileged account logins outside business hours. ATT&CK: T1078.002
dispatch.earliest_time = -24h@h
dispatch.latest_time = @h
display.general.type = statistics
is_scheduled = 1
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=wineventlog sourcetype="WinEventLog:Security" EventCode=4624 (TargetUserName="admin*" OR TargetUserName="svc-*" OR TargetUserName="sa-*") \
  | eval hour = strftime(_time, "%H") \
  | eval day_of_week = strftime(_time, "%A") \
  | where (hour < 7 OR hour >= 19) OR (day_of_week="Saturday" OR day_of_week="Sunday") \
  | stats count as logon_count, values(IpAddress) as source_ips, values(WorkstationName) as workstations, earliest(_time) as first_seen, latest(_time) as last_seen by TargetUserName, LogonType \
  | eval first_seen = strftime(first_seen, "%Y-%m-%d %H:%M:%S") \
  | eval last_seen = strftime(last_seen, "%Y-%m-%d %H:%M:%S") \
  | eval logon_type_desc = case(LogonType=2, "Interactive", LogonType=3, "Network", LogonType=4, "Batch", LogonType=5, "Service", LogonType=7, "Unlock", LogonType=8, "NetworkCleartext", LogonType=9, "NewCredentials", LogonType=10, "RemoteInteractive", LogonType=11, "CachedInteractive", true(), "Unknown") \
  | sort - logon_count \
  | table TargetUserName, logon_type_desc, logon_count, source_ips, workstations, first_seen, last_seen
action.notable.param.rule_description = Off-Hours Privileged Logon: $TargetUserName$ ($logon_count$ events)
action.notable.param.rule_title = SIEM - Privileged Account Off-Hours Logon
action.notable.param.security_domain = access
action.summary_index._name = summary
action.summary_index.inverse = 0

